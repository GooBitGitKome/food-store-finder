steps:
  # 1. Docker Build (backend ディレクトリをコンテキストとしてビルド)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/food-store-finder-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/food-store-finder-api:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Container Registry / Artifact Registry へ Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/food-store-finder-api:$COMMIT_SHA'

  # 3. Cloud Run へデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'food-store-finder-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/food-store-finder-api:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/food-store-finder-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
